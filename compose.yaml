services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: sqlite:////data/alphawatch.db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-local-compose-secret-change-me-32-bytes}
    ports:
      - "8000:8000"
    volumes:
      - alphawatch-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 5

  seed:
    build: .
    command: python scripts/seed.py
    environment:
      DATABASE_URL: sqlite:////data/alphawatch.db
      SECRET_KEY: ${SECRET_KEY:-local-compose-secret-change-me-32-bytes}
    volumes:
      - alphawatch-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai:
    build: .
    command: uvicorn ai_service.main:app --host 0.0.0.0 --port 8010
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: sqlite:////data/alphawatch.db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-local-compose-secret-change-me-32-bytes}
      WORKER_REFRESH_INTERVAL_SECONDS: "300"
      REFRESH_CONCURRENCY: "4"
      REFRESH_RETRIES: "2"
    volumes:
      - alphawatch-data:/data
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    environment:
      API_BASE_URL: http://api:8000
      AI_SERVICE_URL: http://ai:8010
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      ai:
        condition: service_healthy

volumes:
  alphawatch-data:
