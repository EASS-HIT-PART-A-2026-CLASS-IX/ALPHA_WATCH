services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: sqlite:////data/alphawatch.db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-compose-secret-change-me
    ports:
      - "8000:8000"
    volumes:
      - alphawatch-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: sqlite:////data/alphawatch.db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-compose-secret-change-me
      WORKER_REFRESH_INTERVAL_SECONDS: "300"
      REFRESH_CONCURRENCY: "4"
      REFRESH_RETRIES: "2"
    volumes:
      - alphawatch-data:/data
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  alphawatch-data:
